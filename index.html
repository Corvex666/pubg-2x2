<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101820">
<title>PUBG Tournament — Команды и составы</title>
<style>
:root{color-scheme:dark;--bg:#101820;--panel:#192630;--panel2:#22333e;--text:#f3f6f8;--muted:#a8b6bf;--accent:#f2a900;--line:#31434e}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#1d303b 0,var(--bg) 55%);color:var(--text);font:16px/1.5 system-ui,Arial,sans-serif;min-height:100vh}
.wrap{width:min(1200px,calc(100% - 32px));margin:auto;padding:48px 0 36px}
header{text-align:center;margin-bottom:28px}
.eyebrow{color:var(--accent);font-weight:800;letter-spacing:.22em;font-size:12px;text-transform:uppercase}
h1{font-size:clamp(28px,5vw,48px);line-height:1.05;margin:10px 0 8px;letter-spacing:-.04em}
.sub{color:var(--muted);margin:0}
.count{display:inline-block;margin-top:14px;border:1px solid #66521d;background:#352c17;color:#ffd56a;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:700}
.updated{color:#71838e;font-size:12px;margin-top:8px}
.search{max-width:560px;margin:24px auto 20px}
input{width:100%;background:#17242d;border:1px solid var(--line);border-radius:14px;padding:14px 18px;color:var(--text);font:inherit;outline:none}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #f2a90022}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px}
.team{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:16px}
.top{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.num{display:grid;place-items:center;flex:0 0 40px;height:40px;border-radius:11px;background:#3a301b;color:#ffd56a;font-weight:900;font-size:13px}
.meta{min-width:0;flex:1}
h2{font-size:17px;margin:0;overflow-wrap:anywhere}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;font-size:12px;color:var(--muted)}
.stats b{color:#ffd56a;font-weight:800}
.player{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#14212a;border:1px solid #263944;border-radius:10px;padding:9px 12px;margin-top:7px}
.player-left{display:flex;align-items:center;gap:10px;min-width:0}
.dot{width:7px;height:7px;background:var(--accent);border-radius:50%;flex:0 0 7px}
.pname{overflow-wrap:anywhere}
.pkills{flex:0 0 auto;font-weight:800;font-size:13px;color:#e8edf2;background:#1b2c36;border-radius:8px;padding:3px 8px}
.empty{display:none;text-align:center;color:var(--muted);padding:34px}
footer{text-align:center;color:#71838e;font-size:12px;margin-top:28px}
</style>
</head>
<body>
<main class="wrap">
<header>
  <div class="eyebrow">PUBG · Tournament</div>
  <h1>Команды и составы</h1>
  <p class="sub" id="formatLabel">Формат Squad · 4 игрока</p>
  <div class="count" id="countLabel">—</div>
  <div class="updated" id="updatedLabel"></div>
</header>
<div class="search"><input id="search" type="search" placeholder="Найти команду или игрока…" aria-label="Поиск"></div>
<section id="teams" class="grid" aria-live="polite"></section>
<div id="empty" class="empty">Ничего не найдено.</div>
<footer>Статический снимок из панели турнира · обновите файл после матчей</footer>
</main>
<script>
const DATA = {"generatedAt":"2026-11-25T12:40:35.507Z","tournamentType":"squad","playersPerTeam":4,"maxTeams":16,"teams":[{"number":26,"slot":26,"id":33,"name":"OTEK_CBUHKE","short_name":"OKC","image":"026.png","color":"003399FF","total_points":1,"total_kills":1,"total_place_points":0,"players":[{"name":"V1xenWife","kills":0},{"name":"yarrmosh","kills":1}]},{"number":27,"slot":27,"id":34,"name":"панки","short_name":"PNK","image":"027.png","color":"008C45FF","total_points":7,"total_kills":3,"total_place_points":4,"players":[{"name":"Onecans88","kills":3},{"name":"MIU_____MIU_-","kills":0}]},{"number":28,"slot":28,"id":35,"name":"Winx","short_name":"WIN","image":"028.png","color":"0055A4FF","total_points":13,"total_kills":7,"total_place_points":6,"players":[{"name":"xROUZZIE","kills":6},{"name":"vivivivivivivika","kills":1}]},{"number":29,"slot":29,"id":36,"name":"Scorpions","short_name":"SCP","image":"029.png","color":"FF9933FF","total_points":3,"total_kills":3,"total_place_points":0,"players":[{"name":"Vpofys","kills":2},{"name":"GADO-_-STb","kills":1}]},{"number":30,"slot":30,"id":37,"name":"rabbits","short_name":"RBT","image":"030.png","color":"0D5EAFEF","total_points":4,"total_kills":4,"total_place_points":0,"players":[{"name":"3a6ecul","kills":0},{"name":"Sellia_","kills":1}]},{"number":31,"slot":31,"id":38,"name":"Worst Duo","short_name":"WRD","image":"031.png","color":"006C35FF","total_points":10,"total_kills":10,"total_place_points":0,"players":[{"name":"SEA_ItsMe","kills":2},{"name":"sdfijsdfsfdyshgy","kills":8}]},{"number":32,"slot":32,"id":39,"name":"Gingers","short_name":"GNR","image":"032.png","color":"FFD700FF","total_points":17,"total_kills":10,"total_place_points":7,"players":[{"name":"bielarusse","kills":6},{"name":"l_LADUSHKA_l","kills":4}]}]};
const root = document.getElementById('teams');
const search = document.getElementById('search');
const empty = document.getElementById('empty');

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render(){
  const q = search.value.trim().toLocaleLowerCase('ru');
  const teams = (DATA.teams || []).filter(t => {
    const blob = (t.name + ' ' + (t.players||[]).map(p => p.name).join(' ')).toLocaleLowerCase('ru');
    return blob.includes(q);
  });
  root.innerHTML = teams.map(t => {
    const players = (t.players || []).map(p =>
      '<div class="player"><div class="player-left"><span class="dot"></span><span class="pname">' +
      esc(p.name) + '</span></div><span class="pkills">' + (p.kills||0) + ' K</span></div>'
    ).join('') || '<div class="player"><div class="player-left"><span class="dot"></span><span class="pname">Нет игроков</span></div></div>';
    return '<article class="team"><div class="top"><div class="num">' +
      String(t.number||0).padStart(2,'0') + '</div><div class="meta"><h2>' + esc(t.name) +
      '</h2><div class="stats"><span>PTS <b>' + (t.total_points||0) +
      '</b></span><span>KILLS <b>' + (t.total_kills||0) +
      '</b></span><span>PLACE <b>' + (t.total_place_points||0) +
      '</b></span></div></div></div>' + players + '</article>';
  }).join('');
  empty.style.display = teams.length ? 'none' : 'block';
}

const n = (DATA.teams||[]).length;
const players = (DATA.teams||[]).reduce((s,t)=>s+(t.players||[]).length,0);
document.getElementById('countLabel').textContent = n + ' команд · ' + players + ' игроков';
if (DATA.generatedAt) {
  try {
    document.getElementById('updatedLabel').textContent =
      'Обновлено: ' + new Date(DATA.generatedAt).toLocaleString('ru-RU');
  } catch(e) {}
}
search.addEventListener('input', render);
render();
</script>
</body>
</html>
