<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101820">
<meta name="description" content="32 команды и составы турнира PUBG 2×2">
<title>PUBG 2×2 — Команды и составы</title>
<style>
:root{color-scheme:dark;--bg:#101820;--panel:#192630;--panel2:#22333e;--text:#f3f6f8;--muted:#a8b6bf;--accent:#f2a900;--line:#31434e}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1d303b 0,var(--bg) 55%);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;min-height:100vh}
.wrap{width:min(1100px,calc(100% - 32px));margin:auto;padding:54px 0 36px}
header{text-align:center;margin-bottom:30px}.eyebrow{color:var(--accent);font-weight:800;letter-spacing:.22em;font-size:12px;text-transform:uppercase}
h1{font-size:clamp(32px,6vw,54px);line-height:1.05;margin:10px 0 8px;letter-spacing:-.04em}
.sub{color:var(--muted);margin:0}.count{display:inline-block;margin-top:16px;border:1px solid #66521d;background:#352c17;color:#ffd56a;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:700}
.search{max-width:560px;margin:28px auto 24px;position:relative}
input{width:100%;background:#17242d;border:1px solid var(--line);border-radius:14px;padding:15px 18px;color:var(--text);font:inherit;outline:none}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #f2a90022}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:14px}
.team{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:18px;transition:transform .15s,border-color .15s}
.team:hover{transform:translateY(-2px);border-color:#8b6a24}
.top{display:flex;align-items:center;gap:12px;margin-bottom:15px}
.num{display:grid;place-items:center;flex:0 0 38px;height:38px;border-radius:11px;background:#3a301b;color:#ffd56a;font-weight:900;font-size:13px}
h2{font-size:18px;margin:0;overflow-wrap:anywhere}
.player{display:flex;align-items:center;gap:10px;background:#14212a;border:1px solid #263944;border-radius:10px;padding:10px 12px;margin-top:8px;overflow-wrap:anywhere}
.dot{width:7px;height:7px;background:var(--accent);border-radius:50%;flex:0 0 7px}
.empty{display:none;text-align:center;color:var(--muted);padding:34px}
footer{text-align:center;color:#71838e;font-size:12px;margin-top:30px}
@media(max-width:500px){.wrap{padding-top:36px}.team{padding:15px}}
</style>
</head>
<body>
<main class="wrap">
<header>
<div class="eyebrow">PUBG · Tournament</div>
<h1>Команды и составы</h1>
<p class="sub">Турнирный формат 2×2</p>
<div class="count">32 команды · 64 игрока</div>
</header>
<div class="search"><input id="search" type="search" placeholder="Найти команду или игрока…" aria-label="Поиск команды или игрока"></div>
<section id="teams" class="grid" aria-live="polite"></section>
<div id="empty" class="empty">Ничего не найдено. Попробуй другой запрос.</div>
<footer>PUBG 2×2 · Список команд и игроков</footer>
</main>
<script>
const teams = [{"name": "womenpower", "players": ["yosh1-_-", "VILKA_LOZHKA_TV"]}, {"name": "TppDemons", "players": ["Danechka_ttv", "N4M0R"]}, {"name": "G@NG B@NG", "players": ["Kendrachka", "1920x1080x60hz"]}, {"name": "SIX SEVEN", "players": ["Plafax", "yyuna-"]}, {"name": "DeJa-Vu", "players": ["Mercy-PennyWise-", "imiss_Kira"]}, {"name": "double trouble", "players": ["BERLIN_GRL", "DMA7zin-"]}, {"name": "200", "players": ["HITMEBABYONEMORE", "H1deaki666-"]}, {"name": "WARG", "players": ["Samurai93", "CheRRy_MuFFin"]}, {"name": "SWAGA", "players": ["re1ikter", "vol4ar4"]}, {"name": "PiuPiuPiu", "players": ["bububuska-_", "iZeeks_"]}, {"name": "СanavaEsports", "players": ["tripplesix666god", "eocci"]}, {"name": "LGBT", "players": ["CTYDEHT-_41TEP", "S_T_E_R_V_A_TTV"]}, {"name": "DirtyGeese", "players": ["I--MANTO--I", "Kabachokslukom"]}, {"name": "Охаёшеньки-датебаёшеньки", "players": ["xmly-", "yyukki-"]}, {"name": "PiPi-PuPu_CHECK", "players": ["Geomat1cs", "Soda_p1shevaya"]}, {"name": "Double Tap", "players": ["Twitch_Dosyasha_", "Twitch-t1mka_x7"]}, {"name": "VIBE", "players": ["XiaoLumoLumo-_-", "XiaoLumiLumi-_-"]}, {"name": "VV", "players": ["Zakerman_Twitch", "twitch_viktaGG"]}, {"name": "pinkDILDO", "players": ["Sallivan", "Ex4mple_1"]}, {"name": "BatulinS_TitS", "players": ["nastyasks", "snup-"]}, {"name": "Could_be_us", "players": ["luvlluv", "1Nsa-"]}, {"name": "OTEK_CBUHKE", "players": ["Anekhord666", "EVADINA"]}, {"name": "панки", "players": ["Ne_v__sebe", "marixwes"]}, {"name": "Hubble-Bubble", "players": ["jenderm", "ElenaPrekrasnaya"]}, {"name": "Scorpions", "players": ["kitsoryu", "Your_Dream069"]}, {"name": "rabbits", "players": ["Ameelie", "whodatboy-"]}, {"name": "Worst Duo", "players": ["Milkerio", "lyutik-"]}, {"name": "Gingers", "players": ["V1xenWife", "yarrmosh"]}, {"name": "QWG", "players": ["Onecans88", "MIU_____MIU_-"]}, {"name": "лоутаб ТИМ", "players": ["xROUZZIE", "vivivivivivivika"]}, {"name": "2БТ", "players": ["Vpofys", "GADO-_-STb"]}, {"name": "Wagner Group", "players": ["TheRussianBOVK", "Sellia_"]}];
const root = document.getElementById('teams');
const search = document.getElementById('search');
const empty = document.getElementById('empty');
function render(){
 const q=search.value.trim().toLocaleLowerCase('ru');
 const filtered=teams.map((team,index)=>({...team,index})).filter(t=>
   (t.name+' '+t.players.join(' ')).toLocaleLowerCase('ru').includes(q));
 root.innerHTML=filtered.map(t=>`
  <article class="team">
   <div class="top"><div class="num">${String(t.index+1).padStart(2,'0')}</div><h2>${escapeHtml(t.name)}</h2></div>
   ${t.players.map(p=>`<div class="player"><span class="dot"></span><span>${escapeHtml(p)}</span></div>`).join('')}
  </article>`).join('');
 empty.style.display=filtered.length?'none':'block';
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
search.addEventListener('input',render);
render();
</script>
</body>
</html>
